  SubAgent:
    description: "A sub-agent of the super-agent.\n\n``ai_model`` controls how this\
      \ sub-agent relates to the supervisor's\nvoice pipeline:\n\n- **inherit** (``ai_model=None``,\
      \ default): sub-agent speaks using\n  the supervisor's session (LLM + STT +\
      \ TTS).\n- **standby** (``ai_model={provider:\"standby\", model:\"standby\"\
      }``):\n  sub-agent is silent — ``tts_node`` drains text, produces no audio.\n\
      \  Only tool calls and handoffs.\n- **informational override** (any other ``{provider,\
      \ model}``):\n  value is shown in the LLM prompt (``ai_str()``) but the sub-agent\n\
      \  still shares the supervisor's session.  Reserved for future\n  per-flow model\
      \ switching."
    properties:
      ai_model:
        anyOf:
        - $ref: '#/$defs/SubAgentModel'
        - type: 'null'
        default: null
        description: Sub-agent model mode. null=inherit supervisor voice, {provider:'standby',model:'standby'}=silent
          worker, other values=informational (shown in prompt, not applied)
      goal:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Goal
      instructions:
        title: Instructions
        type: string
      name:
        title: Name
        type: string
      role:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Role
      tool_ids:
        items:
          type: string
        title: Tool Ids
        type: array
    required:
    - name
    - instructions
    title: SubAgent
    type: object
  SubAgentModel:
    description: "Per-flow (Flow = Sub-Agent) model declaration for a sub-agent.\n\
      \nUses plain strings (not enums) for flexibility — Claude Box YAMLs can\nset\
      \ arbitrary provider/model combos without backend enum changes.\n\nFunctional\
      \ modes today:\n    - ``standby``  (provider=\"standby\", model=\"standby\"\
      )\n      Activates silent mode on the FlowAgent: ``tts_node`` is muted,\n  \
      \    prompt switches to tool-only instructions.\n    - Any other value is **informational**\
      \ — shown in the LLM-visible\n      ``ai_str()`` but the sub-agent still shares\
      \ the supervisor's\n      session (LLM, STT, TTS).  True per-flow model switching\
      \ is not\n      yet implemented.\n\nCompared to the top-level ``AIModelConfig``\
      \ (scenario → supervisor):\n    AIModelConfig adds cascade-specific fields (tts_provider,\n\
      \    tts_voice_id, llm_provider, llm_model, stt_provider) that are\n    not\
      \ needed here because sub-agents share the supervisor's session.\n    If per-flow\
      \ model switching is implemented in the future, this\n    schema would need\
      \ to be extended for cascade sub-agents."
    properties:
      model:
        title: Model
        type: string
      provider:
        title: Provider
        type: string
    required:
    - provider
    - model
    title: SubAgentModel
    type: object
